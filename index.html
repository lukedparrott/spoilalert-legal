<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpoilAlert</title>
    <style>
        :root {
            --primary: #10B981;
            --text-main: #1F2937;
            --text-muted: #4B5563;
            --bg-page: #F9FAFB;
            --bg-card: #FFFFFF;
            --border: #E5E7EB;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #34D399;
                --text-main: #F9FAFB;
                --text-muted: #9CA3AF;
                --bg-page: #111827;
                --bg-card: #1F2937;
                --border: #374151;
            }
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }
        .container {
            max-width: 540px;
            width: 100%;
            background: var(--bg-card);
            padding: 48px 36px;
            border-radius: 20px;
            border: 1px solid var(--border);
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }
        h1 {
            margin: 0 0 8px 0;
            font-size: 1.8rem;
        }
        p {
            color: var(--text-muted);
            margin: 0 0 28px 0;
        }
        .links {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        a {
            display: inline-block;
            padding: 10px 18px;
            background-color: var(--bg-page);
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        a:hover {
            border-color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🥗⏰</div>
        <h1>SpoilAlert</h1>
        <p>Food waste prevention &amp; pantry tracking for iOS.</p>
        <div class="links">
            <a href="privacy.html">Privacy Policy</a>
            <a href="support.html">Support &amp; FAQ</a>
        </div>
    </div>
</body>
</html>
